<!-- Administración › Lista de usuarios y residentes (solo admin). Lógica: js/pantallas/admin/usuarios.js -->
<sc-if value="{{ verUsuarios }}" hint-placeholder-val="{{ false }}">
  <div class="p-backbar"><div class="p-wrap p-ancho"><button type="button" class="p-link up" style="padding:0" sc-camel-on-click="{{ irPerfil }}">← Volver</button></div></div>
  <div class="p-head"><div class="p-wrap p-ancho p-stack">
    <div>
      <div class="p-kicker">Administración</div>
      <h1 class="p-h1">Usuarios y residentes</h1>
    </div>
    <div class="p-seg">
      <sc-for list="{{ uFiltros }}" as="f" hint-placeholder-count="4">
        <button type="button" class="{{ f.cls }}" sc-camel-on-click="{{ f.elegir }}">{{ f.nombre }}</button>
      </sc-for>
    </div>
    <div class="p-field">
      <div class="p-label">Buscar</div>
      <div class="p-search">
        <input class="p-input" value="{{ uBusqueda }}" sc-camel-on-change="{{ uSetBusqueda }}" sc-camel-on-key-down="{{ uEnter }}" placeholder="Nombre o correo" maxlength="100">
        <button type="button" class="p-btn sm" sc-camel-on-click="{{ uBuscar }}">{{ uBuscarTxt }}</button>
      </div>
    </div>
  </div></div>
  <div class="p-body p-ancho p-cols">
    <button type="button" class="p-btn pri full" sc-camel-on-click="{{ uAlta }}">Dar de alta a alguien</button>
    <sc-for list="{{ uLista }}" as="u" hint-placeholder-count="3">
      <div class="p-card plain">
        <button type="button" class="p-ucard" style="background:transparent;border:none" sc-camel-on-click="{{ u.abrir }}">
          <div class="p-pills" style="margin-bottom:8px">
            <span class="p-pill">{{ u.rol }}</span>
            <span class="{{ u.estadoCls }}">{{ u.estado }}</span>
          </div>
          <div class="p-btitle">{{ u.nombre }}</div>
          <div class="p-meta">{{ u.detalle }}</div>
        </button>
      </div>
    </sc-for>
    <sc-if value="{{ uCargando }}" hint-placeholder-val="{{ false }}"><div class="p-cargando">Cargando cuentas…</div></sc-if>
    <sc-if value="{{ uError }}" hint-placeholder-val="{{ false }}">
      <div class="p-note err">{{ uError }} <button type="button" class="p-link" sc-camel-on-click="{{ uReintentar }}">Reintentar</button></div>
    </sc-if>
    <sc-if value="{{ uVacio }}" hint-placeholder-val="{{ false }}">
      <div class="p-empty"><h2 class="p-h2">{{ uVacioTitulo }}</h2><p>{{ uVacioTexto }}</p></div>
    </sc-if>
    <sc-if value="{{ uHayMas }}" hint-placeholder-val="{{ false }}">
      <button type="button" class="p-btn full" sc-camel-on-click="{{ uMas }}">Ver más</button>
    </sc-if>
  </div>
</sc-if>
